# =============================================================================
# 自动打包 exe 并发布到 GitHub Releases
#
# 触发方式（两条，互不影响）：
#   1) 手动：Actions → "打包 exe 并发布" → Run workflow
#      → 只产出 artifact（可在本次 run 的 Artifacts 里下载 zip），不发 Release
#   2) 打 tag：git tag v0.0.2beta && git push origin v0.0.2beta
#      → 打包 + 自检 + 建 Release 并挂上 zip
#      标签里带 - 或 alpha/beta/rc/preview/dev 字样的（v0.0.1beta、v1.1.0-rc1）自动标 prerelease
#      若该 Release 已由人在网页上建好，只补传/覆盖 zip 附件，不会因"已存在"而报错
#
# 不需要在仓库 Settings 里配任何 secret：建 Release 用的是工作流自带的
# GITHUB_TOKEN（靠上面的 permissions: contents: write 授权）。
#
# 版本一致性：tag 去掉开头的 v 之后必须等于 llm_console/core/config.py 里的
# APP_VERSION，对不上直接失败——避免"Release 写着 v1.2.0、里面 exe 是 1.1.0"。
# =============================================================================
name: 打包 exe 并发布

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # 发布类流水线不能"后来者掐前一个"：2026-09-30 那次 run 显示 cancelled，
  # 就是我在它还在跑的时候又推了一次同名标签，被这条策略自己取消了。
  cancel-in-progress: false

env:
  APP_NAME: llm-chat
  # 与本机验证过的那次构建保持一致；换版本请重新跑一遍 --selfcheck
  PY_VERSION: "3.14"
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  build:
    name: 在 Windows 上打包
    runs-on: windows-latest
    timeout-minutes: 10        # 万一哪一步挂住，最多烧 10 分钟就红，不会拖到六小时
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: 装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      - name: 校验 tag 与 APP_VERSION 一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(grep -m1 '^APP_VERSION' llm_console/core/config.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v$TAG  APP_VERSION=$SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::版本号不一致：先改 config.py 的 APP_VERSION 再打 tag"
            exit 1
          fi

      # --specpath/--workpath 指到 build/ 下，仓库根只留 dist/，路径干净
      - name: 打包成单文件 exe
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean \
            --onefile --windowed --name "$APP_NAME" \
            --distpath dist --workpath build/work --specpath build \
            llama_gui.py
          ls -la dist

      # 两道自检：源码级那道只跑 Python 代码，不可能挂住；exe 那道才真正验证"这份打包
      # 产物能不能跑"。--windowed 的 exe 是 GUI 子系统程序，在 runner（Session 0）里
      # 拿不到它的退出码（bash 直接调、PowerShell -Wait 都实测等不到，见下面注释），
      # 所以判定改成"重定向到文件 + 读文件里的结论"，超时就把进程杀掉再判。
      - name: 自检 · 源码级（模拟冻结）
        shell: bash
        run: |
          python - <<PY
          import sys
          sys.frozen = True
          sys.executable = r"dist/$APP_NAME.exe"
          sys.path.insert(0, ".")
          from llm_console.ui.app import selfcheck
          sys.exit(selfcheck())
          PY
          test -s "dist/$APP_NAME.exe"

      # ⚠ 这一步里**不能出现非 ASCII 字符**（连注释也不行）：Actions 把 run 脚本写成
      # UTF-8 无 BOM 的临时 .ps1，而 Windows PowerShell 5.1 按系统 ANSI 码页读它，
      # 中文会变成乱码并把字符串引号/大括号吃掉 → ParserError，脚本根本没跑到 exe
      # （2026-09-30 那次失败就是这样）。要中文说明就写在 YAML 注释里（bash 步骤不受影响）。
      #
      # 判定不依赖进程退出：runner 上拿不到 --windowed exe 的退出码（实测 -Wait 会一直等，
      # 烧满 timeout-minutes 被掐），但自检输出早就写进重定向文件了。本地 cmd / git-bash
      # 里它 2 秒就退，所以这个差异只在 CI 出现 —— 用"文件里有 SELFCHECK OK"当判据，
      # 60 秒没退出就杀掉进程再读文件。
      - name: Selfcheck (run the packaged exe)
        shell: powershell
        run: |
          $exe = "dist\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP "selfcheck.out"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--selfcheck" -PassThru -RedirectStandardOutput $out
          if (-not $p.WaitForExit(60000)) {
            Write-Host "process did not exit within 60s; killing it and judging by captured output"
            try { $p.Kill() | Out-Null; $p.WaitForExit(5000) | Out-Null } catch {}
          }
          Start-Sleep -Milliseconds 500
          $txt = ""
          if (Test-Path $out) { $txt = Get-Content $out -Raw }
          Write-Host "--- selfcheck output ---"
          Write-Host $txt
          Write-Host "------------------------"
          if ($txt -match "SELFCHECK OK") { exit 0 }
          Write-Error "packaged exe selfcheck did not report OK"
          exit 1

      - name: 组发布包（exe + README 一起打包成 zip）
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VER="$GITHUB_REF_NAME"; else VER="v$(grep -m1 '^APP_VERSION' llm_console/core/config.py | sed -E 's/.*"([^"]+)".*/\1/')-dev"; fi
          STAGE="llm-chat-$VER-windows-x64"
          mkdir -p "out/$STAGE"
          cp "dist/$APP_NAME.exe" "out/$STAGE/"
          cp README.md "out/$STAGE/"
          python -c "import shutil; shutil.make_archive('out/$STAGE', 'zip', 'out', '$STAGE')"
          ls -la out

      - name: 上传 artifact（任何触发都会留档）
        uses: actions/upload-artifact@v4
        with:
          name: llm-chat-windows-x64-${{ github.sha }}
          path: out/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: 建 Release 并挂 zip（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'MD'
          ### 怎么装
          1. 下载 zip，解压出 `llm-chat.exe`。
          2. 推荐把它放到推理引擎旁边：`llm-chat.exe` + `llama-server.exe`（含其 dll）+ `models\*.gguf` 同一层目录。
             放别处也行，第一次启动后在 设置 → 服务参数 里指路。
          3. 双击运行。首次会在同目录生成 `gui_config.json`（配置）与 `secrets.json`（云端密钥）。

          ### 注意
          - 本 exe **未做代码签名**，Windows SmartScreen 第一次可能拦一下：点「更多信息」→「仍要运行」。
          - 单文件 exe 启动时会往 `%TEMP%` 解一份运行库，属正常行为。
          - 引擎与模型权重都不在安装包里，需自行下载，见 README。
          MD
          ARGS=()
          # 预发布判定：带 - 或带 alpha/beta/rc/preview/dev 字样的都算（v0.0.1beta 这种没连字符也算）
          case "$GITHUB_REF_NAME" in
            *-*|*alpha*|*beta*|*rc[0-9]*|*preview*|*dev*) ARGS+=(--prerelease) ;;
          esac
          # Release 可能已经由人在网页上建好（草稿或预发布）：那就只补传附件，别报错
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在 → 只上传/覆盖 zip 附件"
            gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/*.zip \
              --title "LLM Chat $GITHUB_REF_NAME" \
              --notes-file notes.md \
              --verify-tag \
              "${ARGS[@]}"
          fi
          echo "发布完成：$GITHUB_REF_NAME"
